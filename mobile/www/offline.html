<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Hub – offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F6F7F9;color:#101E35}
  main{max-width:340px;padding:32px 24px;text-align:center;background:#fff;border:1px solid #E7EAF0;border-radius:16px;margin:16px}
  img{height:56px;margin-bottom:20px}
  h1{font-size:22px;margin:0 0 8px}
  p{font-size:14px;color:#687489;margin:0 0 24px;line-height:1.5}
  button{height:44px;padding:0 20px;border:0;border-radius:8px;background:#0066FF;color:#fff;font-weight:600;font-size:14px}
</style>
</head>
<body>
<main>
  <img src="logo-mark.png" alt="SaxsProjects">
  <h1>You're offline</h1>
  <p>The Team Hub needs an internet connection. Check your data or Wi-Fi and try again.</p>
  <button onclick="location.href='https://hub.saxsprojects.co.za/'">Try again</button>
</main>
</body>
</html>
