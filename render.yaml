# Render Blueprint for the Team Hub API. Render: New > Blueprint > pick this repo.
# Create a free PostgreSQL database on Neon first and paste its URL as DATABASE_URL.
services:
  - type: web
    name: saxs-team-hub-api
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    # Apply database migrations, then start the API.
    # Proxy headers are read by the app itself (TRUSTED_PROXY_HOPS), never trusted blindly by uvicorn.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: ENVIRONMENT
        value: production
      # Proxy layers in front of the app whose X-Forwarded-For entries are trusted (Render: 1).
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Runtime login: can only read and write rows (see docs/deploy.md).
      - key: DATABASE_URL
        sync: false
      # Table owner, used only by `alembic upgrade head` at start-up.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: JOBS_TOKEN
        sync: false
      # Until the React frontend exists, use this service's own URL: the API serves
      # the offer and password pages that email links open.
      - key: FRONTEND_URL
        sync: false
      # true = interactive API docs at /docs, to manage the Team Hub from a browser
      - key: ENABLE_API_DOCS
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: SMTP_HOST
        value: smtppro.zoho.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Company details printed on quotations, invoices and receipts.
      - key: COMPANY_LEGAL_NAME
        value: SaxsProjects (Pty) Ltd
      - key: COMPANY_REGISTRATION_NUMBER
        value: 2026/941760/07
      - key: COMPANY_ADDRESS
        value: Thohoyandou|Limpopo|South Africa
      - key: COMPANY_WEBSITE
        value: www.saxsprojects.co.za
      - key: COMPANY_EMAIL
        sync: false
      - key: COMPANY_PHONE
        sync: false
      # Banking details: set in the Render dashboard only, never in this file.
      - key: COMPANY_BANK_NAME
        sync: false
      - key: COMPANY_BANK_ACCOUNT_NAME
        sync: false
      - key: COMPANY_BANK_ACCOUNT_NUMBER
        sync: false
      - key: COMPANY_BANK_BRANCH_CODE
        sync: false
      - key: COMPANY_BANK_ACCOUNT_TYPE
        sync: false
      # The director's signature: upload signature.png as a Render Secret File.
      - key: SIGNATURE_IMAGE_PATH
        value: /etc/secrets/signature.png
      - key: SIGNATORY_NAME
        sync: false
      - key: SIGNATORY_TITLE
        value: Director
