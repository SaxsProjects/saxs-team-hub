# Publish a release when a version tag (v1.2.3) is pushed: checks, builds the packages and attaches
# them to a GitHub Release with that version's changelog notes.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the product version
        working-directory: .
        run: bash .github/scripts/check-versions.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci
      - name: Build the Windows installers and the signed update files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --ci
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set; installers are built but the app can't update itself from this release"
            npx tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
          v="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp src-tauri/target/release/bundle/msi/*.msi "out/saxs-team-hub-windows-$v.msi"
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/saxs-team-hub-windows-$v-setup.exe"
          for f in src-tauri/target/release/bundle/msi/*.msi.sig; do [ -e "$f" ] && cp "$f" "out/saxs-team-hub-windows-$v.msi.sig"; done
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe.sig; do [ -e "$f" ] && cp "$f" "out/saxs-team-hub-windows-$v-setup.exe.sig"; done
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: desktop/out/
          if-no-files-found: error

  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the product version
        run: bash .github/scripts/check-versions.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1 (pinned: this job can hold signing secrets)
      - name: Build the signed Android app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Android signing secrets not set; the APK is not built here"
            exit 0
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/teamhub-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          cd mobile
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../../dist/saxs-team-hub-android-${GITHUB_REF_NAME#v}.apk"
          rm -f "$ANDROID_KEYSTORE_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: windows
      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          (cd frontend/dist && zip -qr "../../dist/saxs-team-hub-web-$v.zip" .)
          git archive --format=zip --prefix="saxs-team-hub-api-$v/" -o "dist/saxs-team-hub-api-$v.zip" HEAD backend render.yaml VERSION CHANGELOG.md
          cp windows/*.msi windows/*-setup.exe dist/
          if [ -e "windows/saxs-team-hub-windows-$v-setup.exe.sig" ]; then
            python3 .github/scripts/updater-manifest.py "$v" windows "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" > dist/latest.json
          fi
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} index($0, "## [") == 1 {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Team Hub $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
