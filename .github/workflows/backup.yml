# Weekly encrypted backup of the Team Hub database, kept as a private build artifact for 90 days.
# Needs repository secrets TEAM_HUB_BACKUP_DATABASE_URL (the read-only teamhub_backup login) and
# TEAM_HUB_BACKUP_KEY (the Fernet BACKUP_KEY). Until both are set the job is skipped.
# GitHub emails the repository owner if a scheduled run fails.
name: Database backup

on:
  schedule:
    - cron: "30 0 * * 0" # Sundays 02:30 South African time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      HAS_SECRETS: ${{ secrets.TEAM_HUB_BACKUP_DATABASE_URL != '' && secrets.TEAM_HUB_BACKUP_KEY != '' }}
    steps:
      - name: Skip until the backup secrets are set
        if: env.HAS_SECRETS != 'true'
        working-directory: .
        run: echo "::notice::Set TEAM_HUB_BACKUP_DATABASE_URL and TEAM_HUB_BACKUP_KEY to enable backups"
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_SECRETS == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: env.HAS_SECRETS == 'true'
        run: pip install -r requirements.txt
      - name: Take and verify the encrypted backup
        if: env.HAS_SECRETS == 'true'
        env:
          DATABASE_URL: ${{ secrets.TEAM_HUB_BACKUP_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.TEAM_HUB_BACKUP_KEY }}
        run: |
          name="teamhub-$(date -u +%Y-%m-%d-%H%M).bak"
          python -m scripts.backup backup "$RUNNER_TEMP/$name" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "BACKUP_FILE=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: env.HAS_SECRETS == 'true'
        with:
          name: database-backup-${{ github.run_number }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
