name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teamhub
      - name: Migrations apply cleanly to PostgreSQL and match the models
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teamhub
        run: |
          alembic upgrade head
          alembic check
          python -m scripts.check_db_guards
      - name: Backup restores into an empty PostgreSQL database
        run: |
          export BACKUP_KEY=$(python -m scripts.backup generate-key)  # throwaway key for this run
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/teamhub python -m scripts.backup backup /tmp/teamhub.bak
          python -m scripts.backup verify /tmp/teamhub.bak
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True); c.execute('CREATE DATABASE restore_drill')"
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/restore_drill
          alembic upgrade head
          python -m scripts.backup restore /tmp/teamhub.bak
          # The restored ids must not block new rows: insert after restoring, then compare a fresh backup.
          python - <<'EOF'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/restore_drill") as c:
              before = c.execute("SELECT count(*) FROM audit_log").fetchone()[0]
              assert before > 0, "nothing was restored"
              c.execute("INSERT INTO audit_log (at, actor, action, entity) VALUES (now(), 'ci', 'restore.drill', 'ci')")
              print("ok: restored", before, "audit rows and new rows still insert")
          EOF
      - run: pip-audit -r requirements.txt


  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck .github/scripts/*.sh
      - run: bash .github/scripts/check-versions.sh
      - name: The changelog has an entry for this version
        run: grep -q "^## \[$(cat VERSION)\]" CHANGELOG.md

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1, pinned to a commit
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx cap sync android
      - name: Build (unsigned debug) to prove the app compiles
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
