name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teamhub
      - name: Migrations apply cleanly to PostgreSQL and match the models
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teamhub
        run: |
          alembic upgrade head
          alembic check
          python -m scripts.check_db_guards
      - run: pip-audit -r requirements.txt

