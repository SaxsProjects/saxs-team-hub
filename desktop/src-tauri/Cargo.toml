[package]
name = "saxs-team-hub-desktop"
version = "2.2.0"
description = "SaxsProjects Team Hub for Windows"
authors = ["SaxsProjects (Pty) Ltd"]
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "teamhub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
